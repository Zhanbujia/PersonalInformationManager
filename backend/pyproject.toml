[project]
name = "personal-memory"
version = "0.1.0"
description = "拾穗 · 个人信息管家（Vue 3 + FastAPI + LangChain）"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "python-multipart>=0.0.9",

    # JWT：自己签 HS256，不引入重型认证库
    "pyjwt>=2.9",

    # AI 框架（锁大版本：v1 承诺到 2.0 前不破坏）
    "langchain>=1.0,<2",
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-openai>=1.0",

    # 文本处理
    "tiktoken>=0.8",
    "jieba>=0.42",

    # 文件解析：把上传的文档抽成纯文本，再进同一条入库流水线
    "pypdf>=5",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",

    # 观测
    "structlog>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "workers*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
